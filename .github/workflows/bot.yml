name: config-bot

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "10 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post یا clean"
        default: "post"

concurrency:
  group: config-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xray
        run: |
          curl -sL -o x.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q x.zip xray
          chmod +x xray
          ./xray version | head -1

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MODE: "${{ github.event.inputs.mode  (github.event.schedule == '10 */6 * * *' && 'clean'  'post') }}"
        run: python bot.py "$MODE"

      - name: Save state
        if: always()
        run: |
          git config user.name "config-bot"
          git config user.email "config-bot@users.noreply.github.com"
          git add state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase -q || true
            git push
          fi
