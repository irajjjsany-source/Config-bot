name: config-bot-startup-cleanup

on:
  workflow_dispatch: {}

concurrency:
  group: config-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xray
        run: |
          curl -sL -o x.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q x.zip xray
          chmod +x xray

      - name: Run one-time 15-day cleanup
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python startup_cleanup.py

      - name: Save state
        if: always()
        run: |
          git config user.name "config-bot"
          git config user.email "config-bot@users.noreply.github.com"
          git add state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update state (startup cleanup)"
            git pull --rebase -q || true
            git push
          fi
