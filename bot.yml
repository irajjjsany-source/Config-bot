name: config-bot

on:
  # GitHub Actions حداقل هر ۵ دقیقه می‌تواند زمان‌بندی شود؛ زمان اجرا ممکن است کمی تأخیر داشته باشد.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "اجرای دستی"
        type: choice
        options:
          - worker
          - post
          - clean
        default: worker
        required: true

concurrency:
  group: config-bot
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xray
        run: |
          curl -fsSL -o x.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q x.zip xray
          chmod +x xray
          ./xray version | head -1

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          MODE="worker"
          if [ -n "$INPUT_MODE" ]; then MODE="$INPUT_MODE"; fi
          python bot.py "$MODE"

      - name: Save state
        if: always()
        run: |
          git config user.name "config-bot"
          git config user.email "config-bot@users.noreply.github.com"
          git add state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update state [skip ci]"
            git pull --rebase -q || true
            git push
          fi
